<!doctype html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-SFV7EXN54K"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-SFV7EXN54K");
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><%= locals.title %></title>

    <!-- Meta Descriptions for SEO -->
    <meta name="description" content="<%= locals.description %>" />
    <% if (locals.keywords) { %>
    <meta name="keywords" content="<%= locals.keywords %>" />
    <% } %>
    <meta name="author" content="Posh Limousines of Atlanta" />
    <% if (locals.canonical) { %>
    <link rel="canonical" href="<%= locals.canonical %>" />
    <% } %>

    <!-- Apple Webkit Meta Configuration -->
    <meta name="apple-mobile-web-app-title" content="Posh Limos" />
    <link rel="apple-touch-icon" href="assets/hero_atlanta.png" />

    <!-- Open Graph Protocol (OG) Metadata -->
    <meta property="og:title" content="<%= locals.ogTitle || locals.title %>" />
    <meta
      property="og:description"
      content="<%= locals.ogDescription || locals.description %>"
    />
    <meta
      property="og:image"
      content="<%= locals.ogImage || 'assets/hero_atlanta.png' %>"
    />
    <meta
      property="og:url"
      content="<%= locals.canonical || 'https://www.atlantaposhlimos.com' %>"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Posh Limousines of Atlanta" />

    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="<%= locals.ogTitle || locals.title %>"
    />
    <meta
      name="twitter:description"
      content="<%= locals.ogDescription || locals.description %>"
    />
    <meta
      name="twitter:image"
      content="<%= locals.ogImage || 'assets/hero_atlanta.png' %>"
    />

    <!-- Primary Stylesheet -->
    <link rel="stylesheet" href="style.css" />
    <% if (locals.heroImage) { %>
    <link rel="preload" as="image" href="<%= locals.heroImage %>" />
    <% } %>
    <% if (locals.pageSchema) { %>
    <script type="application/ld+json">
      <%- JSON.stringify(locals.pageSchema, null, 2) %>
    </script>
    <% } %>
    <!-- Cal.com embed begin -->
    <script type="text/javascript">
      (function (C, A, L) {
        let p = function (a, ar) { a.q.push(ar); };
        let d = C.document;
        C.Cal = C.Cal || function () {
          let cal = C.Cal;
          let ar = arguments;
          if (!cal.loaded) {
            cal.ns = {};
            cal.q = cal.q || [];
            d.head.appendChild(d.createElement("script")).src = A;
            cal.loaded = true;
          }
          if (ar[0] === L) {
            const api = function () { p(api, arguments); };
            const namespace = ar[1];
            api.q = api.q || [];
            if (typeof namespace === "string") {
              cal.ns[namespace] = cal.ns[namespace] || api;
              p(cal.ns[namespace], ar);
              p(cal, ["initNamespace", namespace]);
            } else p(cal, ar);
            return;
          }
          p(cal, ar);
        };
      })(window, "https://app.cal.com/embed/embed.js", "init");

      Cal("init", { origin: "https://cal.com" });
      Cal("ui", { hideEventTypeDetails: false, layout: "month_view" });
    </script>
    <!-- Cal.com embed end -->
  </head>
  <body></body>
</html>
