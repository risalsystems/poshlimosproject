<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trip Cost Estimator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f3;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .wrapper { max-width: 520px; margin: 0 auto; }

    h1 { font-size: 22px; font-weight: 500; margin-bottom: 0.25rem; }
    .subtitle { font-size: 14px; color: #666; margin-bottom: 1.5rem; }

    .card {
      background: #fff;
      border: 0.5px solid rgba(0,0,0,0.12);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }

    .section-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #888;
      margin-bottom: 12px;
    }

    label { display: block; font-size: 12px; color: #666; margin-bottom: 5px; }

    input[type="text"],
    input[type="number"],
    input[type="time"] {
      width: 100%;
      height: 38px;
      border: 0.5px solid rgba(0,0,0,0.18);
      border-radius: 8px;
      padding: 0 10px;
      font-size: 14px;
      font-family: inherit;
      color: #1a1a1a;
      background: #fff;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus { border-color: rgba(0,0,0,0.4); }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .inset { background: #f5f5f3; border-radius: 8px; padding: 1rem; }
    .inset + .inset { margin-top: 10px; }

    /* Route */
    .route-row { position: relative; margin-bottom: 10px; }
    .route-row:last-of-type { margin-bottom: 0; }
    .route-dot {
      position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
      width: 8px; height: 8px; border-radius: 50%; background: #3266ad;
    }
    .route-dot.dest { background: #b84c3b; border-radius: 2px; }
    .route-row input[type="text"] { padding-left: 28px; }

    #distanceResult { font-size: 12px; color: #888; margin-top: 8px; min-height: 18px; }
    #distanceResult.ok  { color: #3266ad; }
    #distanceResult.err { color: #b84c3b; }

    /* Checkbox rows */
    .check-row { display: flex; align-items: center; gap: 8px; }
    .check-row input[type="checkbox"] { width: 15px; height: 15px; cursor: pointer; flex-shrink: 0; }
    .check-row span { font-size: 14px; }

    #peachNote { font-size: 12px; color: #666; padding-left: 23px; margin-top: 6px; display: none; }

    /* Gratuity */
    .grat-btns { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 6px; }
    .grat-btn {
      font-size: 12px; font-family: inherit; padding: 4px 12px;
      border-radius: 20px; border: 0.5px solid rgba(0,0,0,0.18);
      background: transparent; cursor: pointer; color: #1a1a1a;
    }
    .grat-btn.active { border: 1.5px solid #1a1a1a; }
    #customGratWrap { display: none; align-items: center; gap: 8px; margin-top: 8px; }
    #customGratWrap span { font-size: 14px; color: #666; }
    #customGratWrap input { width: 130px; }
    #gratControls.disabled { opacity: 0.4; pointer-events: none; }

    /* Estimate range — the hero element */
    .estimate-card {
      background: #fff;
      border: 0.5px solid rgba(0,0,0,0.12);
      border-radius: 12px;
      padding: 1.75rem 1.25rem;
      text-align: center;
      margin-bottom: 1rem;
    }

    .estimate-label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.75rem; }

    .range-display {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .range-val {
      font-size: 36px;
      font-weight: 500;
      color: #1a1a1a;
      min-width: 120px;
    }

    .range-sep { font-size: 20px; color: #bbb; }

    .range-zero { font-size: 36px; font-weight: 500; color: #bbb; }

    .estimate-note {
      font-size: 12px;
      color: #999;
      margin-top: 1rem;
    }

    .pac-container { z-index: 9999; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="wrapper">
    <h1>Trip Cost Estimator</h1>
    <p class="subtitle">SUV · Luxury transport service</p>

    <div class="card">

      <!-- Route -->
      <div class="inset" style="margin-bottom:10px;">
        <div class="section-label">Route</div>
        <div class="route-row">
          <div class="route-dot"></div>
          <input type="text" id="pickup" placeholder="Pickup address" autocomplete="off">
        </div>
        <div class="route-row">
          <div class="route-dot dest"></div>
          <input type="text" id="dropoff" placeholder="Destination address" autocomplete="off">
        </div>
        <div id="distanceResult">Enter pickup and destination to calculate distance</div>
      </div>

      <!-- Time & Miles -->
      <div class="grid-2" style="margin-bottom:10px;">
        <div>
          <label for="pickupTime">Pickup time</label>
          <input type="time" id="pickupTime" value="09:00">
        </div>
        <div>
          <label for="miles">Distance (miles)</label>
          <input type="number" id="miles" value="" min="0" max="300" step="0.1" placeholder="Auto-filled">
        </div>
      </div>

      <!-- Peach Pass -->
      <div class="inset" style="margin-bottom:10px;">
        <div class="check-row">
          <input type="checkbox" id="peachPass">
          <span>Peach Pass requested</span>
        </div>
        <div id="peachNote"></div>
      </div>

      <!-- Additional Stops -->
      <div class="inset" style="margin-bottom:10px;">
        <label style="font-size:13px; color:#444; margin-bottom:10px;">
          Additional stops
          <span style="font-size:11px; color:#999;">(within 2 miles of pickup are free)</span>
        </label>
        <div class="grid-2">
          <div>
            <label for="stopCount">Stops &gt; 2 mi from pickup</label>
            <input type="number" id="stopCount" value="0" min="0" max="20" step="1">
          </div>
          <div>
            <label for="stopMiles">Total extra miles</label>
            <input type="number" id="stopMiles" value="0" min="0" max="100" step="0.5">
          </div>
        </div>
      </div>

      <!-- Gratuity -->
      <div class="inset">
        <div class="check-row">
          <input type="checkbox" id="gratToggle" checked>
          <span>Include gratuity in estimate</span>
        </div>
        <div id="gratControls">
          <div class="grat-btns">
            <button class="grat-btn"        onclick="setGratPct(15)" id="btn15">15%</button>
            <button class="grat-btn active" onclick="setGratPct(20)" id="btn20">20%</button>
            <button class="grat-btn"        onclick="setGratPct(25)" id="btn25">25%</button>
            <button class="grat-btn"        onclick="setCustomMode()" id="btnCustom">Custom $</button>
          </div>
          <div id="customGratWrap">
            <span>$</span>
            <input type="number" id="customGrat" placeholder="0.00" min="0" step="0.01" oninput="calculate()">
          </div>
        </div>
      </div>

    </div>

    <!-- Estimate range -->
    <div class="estimate-card">
      <div class="estimate-label">Estimated range</div>
      <div class="range-display" id="rangeDisplay">
        <span class="range-zero">$0</span>
      </div>
      <div class="estimate-note">Final price confirmed at booking · Gratuity at client's discretion</div>
    </div>

  </div>

  <script>
    const BASE = 40, RATE = 3.13, STOP_FEE = 20;
    let gratPct = 20, isCustom = false;

    function setGratPct(pct) {
      gratPct = pct; isCustom = false;
      document.getElementById('customGratWrap').style.display = 'none';
      document.getElementById('customGrat').value = '';
      ['btn15','btn20','btn25','btnCustom'].forEach(id => document.getElementById(id).classList.remove('active'));
      document.getElementById('btn' + pct).classList.add('active');
      calculate();
    }

    function setCustomMode() {
      isCustom = true;
      ['btn15','btn20','btn25','btnCustom'].forEach(id => document.getElementById(id).classList.remove('active'));
      document.getElementById('btnCustom').classList.add('active');
      document.getElementById('customGratWrap').style.display = 'flex';
      document.getElementById('customGrat').focus();
      calculate();
    }

    function getPeachPass(t) {
      const [h, m] = t.split(':').map(Number);
      const mins = h * 60 + m;
      if (mins >= 360 && mins < 600)  return { rate: 20, label: '6am–10am peak', offPeak: false };
      if (mins >= 600 && mins < 900)  return { rate: 15, label: '10am–3pm', offPeak: false };
      if (mins >= 900 && mins < 1080) return { rate: 20, label: '3pm–6pm peak', offPeak: false };
      return { rate: 10, label: 'off-peak', offPeak: true };
    }

    function fmt(n) {
      return '$' + Math.round(n).toLocaleString();
    }

    function calculate() {
      const time     = document.getElementById('pickupTime').value || '09:00';
      const miles    = parseFloat(document.getElementById('miles').value) || 0;
      const usePeach = document.getElementById('peachPass').checked;
      const stops    = parseInt(document.getElementById('stopCount').value) || 0;
      const stopMi   = parseFloat(document.getElementById('stopMiles').value) || 0;
      const useGrat  = document.getElementById('gratToggle').checked;

      const pp      = getPeachPass(time);
      const late    = parseInt(time.split(':')[0]) < 6;
      const subtotal = BASE + (miles * RATE) + (late ? 30 : 0)
                     + (usePeach ? pp.rate : 0)
                     + (stops * STOP_FEE) + (stopMi * RATE);

      let grat = 0;
      if (useGrat) {
        grat = isCustom
          ? (parseFloat(document.getElementById('customGrat').value) || 0)
          : subtotal * gratPct / 100;
      }

      const total = subtotal + grat;
      const low   = total * 0.95;
      const high  = total * 1.10;

      // Peach Pass note
      const note = document.getElementById('peachNote');
      note.style.display = 'block';
      note.textContent = pp.offPeak
        ? '⚠ Off-peak — Peach Pass not typically needed. +$10 if still requested.'
        : `${pp.label} rate applies`;

      // Gratuity controls
      const gratCtrl = document.getElementById('gratControls');
      gratCtrl.classList.toggle('disabled', !useGrat);

      // Range display
      const display = document.getElementById('rangeDisplay');
      if (miles === 0) {
        display.innerHTML = '<span class="range-zero">$0</span>';
      } else {
        display.innerHTML = `
          <span class="range-val">${fmt(low)}</span>
          <span class="range-sep">–</span>
          <span class="range-val">${fmt(high)}</span>`;
      }
    }

    document.getElementById('gratToggle').addEventListener('change', calculate);
    ['pickupTime','miles','peachPass','stopCount','stopMiles'].forEach(id => {
      document.getElementById(id).addEventListener('input', calculate);
      document.getElementById(id).addEventListener('change', calculate);
    });

    calculate();

    // ── Google Maps ──────────────────────────────────────────────────────────
    window.initMap = function () {
      const opts = { componentRestrictions: { country: 'us' } };
      const pAuto = new google.maps.places.Autocomplete(document.getElementById('pickup'),  opts);
      const dAuto = new google.maps.places.Autocomplete(document.getElementById('dropoff'), opts);
      [pAuto, dAuto].forEach(ac => ac.addListener('place_changed', getDistance));
    };

    function getDistance() {
      const pickup  = document.getElementById('pickup').value.trim();
      const dropoff = document.getElementById('dropoff').value.trim();
      const status  = document.getElementById('distanceResult');
      if (!pickup || !dropoff) return;

      status.className = '';
      status.textContent = 'Calculating distance…';

      new google.maps.DistanceMatrixService().getDistanceMatrix({
        origins: [pickup],
        destinations: [dropoff],
        travelMode: google.maps.TravelMode.DRIVING,
        unitSystem: google.maps.UnitSystem.IMPERIAL,
      }, (res, stat) => {
        if (stat !== 'OK') {
          status.className = 'err';
          status.textContent = 'Could not calculate distance — check addresses.';
          return;
        }
        const el = res.rows[0].elements[0];
        if (el.status !== 'OK') {
          status.className = 'err';
          status.textContent = 'Route not found — try more specific addresses.';
          return;
        }
        const miles = (el.distance.value / 1609.34).toFixed(1);
        document.getElementById('miles').value = miles;
        status.className = 'ok';
        status.textContent = `${miles} miles · approx. ${el.duration.text} drive`;
        calculate();
      });
    }
  </script>

  <!--
    Replace YOUR_GOOGLE_MAPS_API_KEY with your actual key.
    Enable in Google Cloud Console:
      · Maps JavaScript API
      · Places API
      · Distance Matrix API
    Restrict the key to your domain for security.
  -->
  <script
    src="https://maps.googleapis.com/maps/api/js?key=GOOGLE_MAPS_API_KEY&libraries=places&callback=initMap"
    async defer>
  </script>
</body>
</html>
