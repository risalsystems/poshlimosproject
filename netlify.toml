# ── Build settings ────────────────────────────────────────────────────────────
[build]
  command   = "npm run build"
  publish   = "dist"

# ── Clean URLs (strip .html extension) ───────────────────────────────────────
[[redirects]]
  from   = "/airport-pickups"
  to     = "/airport-pickups.html"
  status = 200

[[redirects]]
  from   = "/casual-events"
  to     = "/casual-events.html"
  status = 200

[[redirects]]
  from   = "/corporate-events"
  to     = "/corporate-events.html"
  status = 200

[[redirects]]
  from   = "/formal-celebrations"
  to     = "/formal-celebrations.html"
  status = 200

[[redirects]]
  from   = "/safe-driver-pickup"
  to     = "/safe-driver-pickup.html"
  status = 200

[[redirects]]
  from   = "/privacy-policy"
  to     = "/privacy-policy.html"
  status = 200

[[redirects]]
  from   = "/tos"
  to     = "/tos.html"
  status = 200

# ── Security & cache headers ──────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

# Long cache for hashed Vite assets (JS/CSS bundles)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Short cache for HTML pages
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
