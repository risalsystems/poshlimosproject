# ── Build settings ────────────────────────────────────────────────────────────
[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

# ── Clean URLs (strip .html extension) ───────────────────────────────────────
[[redirects]]
  from   = "/airport-transfers"
  to     = "/airport-transfers.html"
  status = 200

[[redirects]]
  from   = "/signature-accounts"
  to     = "/signature-accounts.html"
  status = 200

[[redirects]]
  from   = "/posh-preferred"
  to     = "/posh-preferred.html"
  status = 200

[[redirects]]
  from   = "/casual-events"
  to     = "/casual-events.html"
  status = 200

[[redirects]]
  from   = "/corporate-events"
  to     = "/corporate-events.html"
  status = 200

[[redirects]]
  from   = "/formal-celebrations"
  to     = "/formal-celebrations.html"
  status = 200

[[redirects]]
  from   = "/safe-driver-pickup"
  to     = "/safe-driver-pickup.html"
  status = 200

[[redirects]]
  from   = "/privacy-policy"
  to     = "/privacy-policy.html"
  status = 200

[[redirects]]
  from   = "/tos"
  to     = "/tos.html"
  status = 200

# ── Redirect raw .html URLs to their clean equivalent ────────────────────────
# Without these, both "/page" (served via the 200 rewrites above) and
# "/page.html" (the real file Netlify serves by default) stay independently
# live and indexable — a duplicate-content pair for every page on the site.
[[redirects]]
  from   = "/airport-transfers.html"
  to     = "/airport-transfers"
  status = 301
  force  = true

[[redirects]]
  from   = "/signature-accounts.html"
  to     = "/signature-accounts"
  status = 301
  force  = true

[[redirects]]
  from   = "/posh-preferred.html"
  to     = "/posh-preferred"
  status = 301
  force  = true

[[redirects]]
  from   = "/casual-events.html"
  to     = "/casual-events"
  status = 301
  force  = true

[[redirects]]
  from   = "/corporate-events.html"
  to     = "/corporate-events"
  status = 301
  force  = true

[[redirects]]
  from   = "/formal-celebrations.html"
  to     = "/formal-celebrations"
  status = 301
  force  = true

[[redirects]]
  from   = "/safe-driver-pickup.html"
  to     = "/safe-driver-pickup"
  status = 301
  force  = true

[[redirects]]
  from   = "/privacy-policy.html"
  to     = "/privacy-policy"
  status = 301
  force  = true

[[redirects]]
  from   = "/tos.html"
  to     = "/tos"
  status = 301
  force  = true

[[redirects]]
  from   = "/index.html"
  to     = "/"
  status = 301
  force  = true

# ── Security & cache headers ──────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    # Allows inline <script> blocks (EJS templates) and Google Maps CDN.
    # Switch unsafe-inline → nonce-based once scripts are in external .js files.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://maps.googleapis.com https://maps.gstatic.com https://calendly.com https://assets.calendly.com https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://calendly.com https://assets.calendly.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com https://calendly.com https://*.calendly.com https://www.google-analytics.com; connect-src 'self' https://maps.googleapis.com https://places.googleapis.com https://calendly.com https://api.calendly.com https://api.web3forms.com https://www.google-analytics.com https://analytics.google.com https://stats.g.doubleclick.net; frame-src https://calendly.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;"
    Permissions-Policy      = "camera=(), microphone=(), geolocation=(), payment=()"

# Long cache for hashed Vite assets (JS/CSS bundles)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Short cache for HTML pages
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
