# ── Build settings ────────────────────────────────────────────────────────────
[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

# ── Clean URLs (strip .html extension) ───────────────────────────────────────
[[redirects]]
  from   = "/airport-transfers"
  to     = "/airport-transfers.html"
  status = 200

[[redirects]]
  from   = "/signature-accounts"
  to     = "/signature-accounts.html"
  status = 200

[[redirects]]
  from   = "/posh-preferred"
  to     = "/posh-preferred.html"
  status = 200

[[redirects]]
  from   = "/casual-events"
  to     = "/casual-events.html"
  status = 200

[[redirects]]
  from   = "/corporate-events"
  to     = "/corporate-events.html"
  status = 200

[[redirects]]
  from   = "/formal-celebrations"
  to     = "/formal-celebrations.html"
  status = 200

[[redirects]]
  from   = "/safe-driver-pickup"
  to     = "/safe-driver-pickup.html"
  status = 200

[[redirects]]
  from   = "/privacy-policy"
  to     = "/privacy-policy.html"
  status = 200

[[redirects]]
  from   = "/tos"
  to     = "/tos.html"
  status = 200

# ── Security & cache headers ──────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    # Allows inline <script> blocks (EJS templates) and Google Maps CDN.
    # Switch unsafe-inline → nonce-based once scripts are in external .js files.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://maps.googleapis.com https://maps.gstatic.com https://calendly.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://calendly.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com https://calendly.com https://*.calendly.com; connect-src 'self' https://maps.googleapis.com https://calendly.com https://api.calendly.com; frame-src https://calendly.com; object-src 'none'; base-uri 'self';"

# Long cache for hashed Vite assets (JS/CSS bundles)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Short cache for HTML pages
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
